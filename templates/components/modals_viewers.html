<!-- MODAL 3: Image Preview -->
    <div id="imgPreviewModal" class="modal-mask" onclick="closeModal('imgPreviewModal')">
        <div style="background: transparent; max-width: 80vw; max-height: 80vh; text-align: center;">
            <img id="previewImgTag" src="" style="max-width: 100%; max-height: 80vh; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        </div>
    </div>
<!-- MODAL 5: Online PDF Viewer Modal (Zero-Plugin Native HTML5 Canvas Reader) -->
    <div id="pdfViewerModal" class="modal-mask">
        <div class="modal-dialog" style="width: 92vw; height: 92vh; max-width: 1500px; display: flex; flex-direction: column; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.35);">
            <!-- Modal Header / Document Title -->
            <div class="modal-header" style="background: #f1f5f9; padding: 10px 20px; border-bottom: 1px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
                    <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                        <div class="modal-title" id="pdfViewerTitle" style="font-size: 15px; font-weight: 600; color: #1e293b;">技术手册在线预览</div>
                        <div id="pdfViewerSubtitle" style="font-size: 12px; color: #64748b;">在线阅读 · 高清渲染</div>
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <a id="pdfDownloadBtn" href="javascript:void(0)" onclick="downloadCurrentPdf(event)" class="btn btn-outline btn-sm" style="display: inline-flex; align-items: center; gap: 6px; border-color: #cbd5e1; background: #fff; color: #1e293b; font-weight: 500;" title="下载技术手册到本地" download>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        <span>下载到本地</span>
                    </a>
                    <button class="modal-close" onclick="closeModal('pdfViewerModal')">&times;</button>
                </div>
            </div>

            <!-- PDF Toolbar: Page controls, Zoom, Jump -->
            <div style="background: #334155; color: #f8fafc; padding: 8px 18px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid #1e293b; font-size: 13px;">
                <!-- Page Navigation -->
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button type="button" class="btn btn-outline btn-sm" id="pdfPrevPageBtn" onclick="onPdfPrevPage()" style="background: #475569; color: #fff; border-color: #64748b;" title="上一页 (快捷键: ← 或 PageUp)">◀ 上一页</button>
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <span>第</span>
                        <input id="pdfPageNumInput" type="number" min="1" value="1" style="width: 52px; text-align: center; padding: 2px 4px; border-radius: 4px; border: 1px solid #64748b; background: #1e293b; color: #fff; font-weight: bold;" onchange="onPdfPageNumChange(this.value)" onkeydown="if(event.key==='Enter') onPdfPageNumChange(this.value)">
                        <span>/ <span id="pdfPageCountSpan">1</span> 页</span>
                    </div>
                    <button type="button" class="btn btn-outline btn-sm" id="pdfNextPageBtn" onclick="onPdfNextPage()" style="background: #475569; color: #fff; border-color: #64748b;" title="下一页 (快捷键: → 或 PageDown)">下一页 ▶</button>
                </div>

                <!-- Zoom Controls -->
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button type="button" class="btn btn-outline btn-sm" onclick="onPdfZoomOut()" style="background: #475569; color: #fff; border-color: #64748b;" title="缩小">缩小</button>
                    <span id="pdfZoomSpan" style="min-width: 48px; text-align: center; font-weight: 500;">120%</span>
                    <button type="button" class="btn btn-outline btn-sm" onclick="onPdfZoomIn()" style="background: #475569; color: #fff; border-color: #64748b;" title="放大">放大</button>
                    <button type="button" class="btn btn-outline btn-sm" onclick="onPdfFitWidth()" style="background: #475569; color: #fff; border-color: #64748b;" title="自适应宽度">↔ 适应宽度</button>
                    <button type="button" class="btn btn-outline btn-sm" onclick="onPdfFitPage()" style="background: #475569; color: #fff; border-color: #64748b;" title="适合整页">↕ 适应整页</button>
                </div>

                <div style="font-size: 12px; color: #94a3b8;">
                    支持鼠标滚轮 · 键盘 ← → 翻页
                </div>
            </div>

            <!-- PDF Viewer Body (Canvas & Scroll Area) -->
            <div id="pdfViewerScrollContainer" style="flex: 1; overflow: auto; background: #525659; display: flex; flex-direction: column; align-items: center; padding: 20px 10px; position: relative;" onwheel="handlePdfWheel(event)">
                <div id="pdfLoadingSpinner" style="position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 14px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 10px; background: rgba(0,0,0,0.75); padding: 18px 28px; border-radius: 8px; z-index: 10;">
                    <div style="width: 28px; height: 28px; border: 3px solid #cbd5e1; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                    <div>正在载入技术手册，请稍候...</div>
                </div>
                <canvas id="pdfViewerCanvas" style="box-shadow: 0 6px 20px rgba(0,0,0,0.4); background: #ffffff; border-radius: 2px; display: none;"></canvas>
            </div>
        </div>
    </div>
<!-- MODAL: 3D CAD (.step / .stp) Interactive Snapshot & Preview -->
    <div id="step3dModal" class="modal-mask" onclick="if(event.target===this) Step3dViewer.closeModal()">
        <div class="modal-dialog" style="width: 840px; max-width: 96vw; display: flex; flex-direction: column; max-height: 94vh;">
            <div class="modal-header" style="background: #f8fafc; border-bottom: 1px solid var(--border); padding: 12px 20px;">
                <div class="modal-title" style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 32px; height: 32px; background: #e0f2fe; color: #0284c7; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 16px;">
                        📦
                    </div>
                    <div>
                        <div style="font-weight: 700; font-size: 15px; color: #1e293b; display: flex; align-items: center; gap: 8px;">
                            <span>3D CAD 模型渲染与实物图截图</span>
                            <span id="step3dFileBadge" style="font-size: 11px; background: #e2e8f0; color: #475569; padding: 1px 8px; border-radius: 4px; font-weight: normal; font-family: monospace;">-</span>
                        </div>
                        <div style="font-size: 12px; color: #64748b; margin-top: 1px;">
                            支持鼠标旋转/缩放/平移调整视角，自动捕捉高清截屏并设为物料实物图
                        </div>
                    </div>
                </div>
                <button class="modal-close" onclick="Step3dViewer.closeModal()">&times;</button>
            </div>

            <div class="modal-body" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto;">
                <!-- 3D Canvas Container -->
                <div id="step3dCanvasWrapper" style="position: relative; width: 100%; height: 460px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.03); display: flex; align-items: center; justify-content: center;">
                    <canvas id="step3dCanvas" style="width: 100%; height: 100%; display: block; outline: none;"></canvas>

                    <!-- Loading Indicator Overlay -->
                    <div id="step3dLoading" style="position: absolute; inset: 0; background: rgba(255, 255, 255, 0.94); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; gap: 12px;">
                        <div class="loading-spinner" style="width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                        <div id="step3dLoadingText" style="font-size: 13px; font-weight: 600; color: #334155;">正在解析 3D CAD 模型，请稍候...</div>
                        <div style="font-size: 11px; color: #94a3b8;">本地浏览器 OpenCASCADE 引擎实时计算，无需联网上传</div>
                    </div>

                    <!-- Canvas Floating Overlay Controls -->
                    <div style="position: absolute; bottom: 10px; left: 12px; background: rgba(15, 23, 42, 0.68); backdrop-filter: blur(4px); color: #fff; font-size: 11px; padding: 4px 10px; border-radius: 4px; pointer-events: none; display: flex; gap: 8px; align-items: center;">
                        <span>🖱️ 左键旋转</span>
                        <span>·</span>
                        <span>滚轮缩放</span>
                        <span>·</span>
                        <span>右键平移</span>
                    </div>

                    <!-- Floating Preset Angle Bar -->
                    <div style="position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(4px); padding: 4px 6px; border-radius: 6px; border: 1px solid #cbd5e1; box-shadow: 0 2px 6px rgba(0,0,0,0.06);">
                        <button type="button" class="btn btn-outline btn-sm" onclick="Step3dViewer.setView('iso')" style="font-size: 11px; padding: 3px 8px;" title="标准等轴测视角">等轴测</button>
                        <button type="button" class="btn btn-outline btn-sm" onclick="Step3dViewer.setView('front')" style="font-size: 11px; padding: 3px 8px;" title="正视">正视</button>
                        <button type="button" class="btn btn-outline btn-sm" onclick="Step3dViewer.setView('top')" style="font-size: 11px; padding: 3px 8px;" title="俯视">俯视</button>
                        <button type="button" class="btn btn-outline btn-sm" onclick="Step3dViewer.setView('right')" style="font-size: 11px; padding: 3px 8px;" title="右视">右视</button>
                        <button type="button" class="btn btn-outline btn-sm" onclick="Step3dViewer.resetCamera()" style="font-size: 11px; padding: 3px 8px;" title="重置并居中视图">↺ 居中</button>
                    </div>
                </div>

                <!-- Control Bar: Color / Edges / Background -->
                <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; background: #f8fafc; padding: 10px 14px; border-radius: 6px; border: 1px solid #e2e8f0;">
                    <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 12px; color: #475569;">
                        <!-- Edge lines toggle -->
                        <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none;">
                            <input type="checkbox" id="step3dEdgesToggle" checked onchange="Step3dViewer.toggleEdges(this.checked)">
                            <span>显示结构轮廓线</span>
                        </label>

                        <!-- Background Color -->
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <span>截图背景：</span>
                            <select id="step3dBgSelect" onchange="Step3dViewer.setBackground(this.value)" class="form-input" style="padding: 2px 6px; font-size: 11px; height: 26px;">
                                <option value="white" selected>纯白背景 (推荐，与Excel最搭)</option>
                                <option value="studio">浅灰工作室 (#f8fafc)</option>
                                <option value="transparent">透明背景 (PNG无底色)</option>
                            </select>
                        </div>

                        <!-- Mesh Material Tone -->
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <span>材质配色：</span>
                            <select id="step3dColorSelect" onchange="Step3dViewer.setColorTheme(this.value)" class="form-input" style="padding: 2px 6px; font-size: 11px; height: 26px;">
                                <option value="default" selected>模型原生配色 / 银灰金属</option>
                                <option value="wind_white">风电白 (RAL 9010)</option>
                                <option value="cad_blue">工业科技蓝</option>
                                <option value="brass">黄铜 / 铜合金</option>
                            </select>
                        </div>
                    </div>

                    <!-- Model Statistics -->
                    <div id="step3dStatsText" style="font-size: 11px; color: #64748b; font-family: monospace;">
                        面数: -
                    </div>
                </div>
            </div>

            <div class="modal-footer" style="padding: 12px 20px; background: #f8fafc; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                <div style="font-size: 12px; color: #64748b;">
                    💡 截图将自动保存为高清晰度 PNG 图片并写入物料数据库
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn btn-outline" onclick="Step3dViewer.closeModal()">取消</button>
                    <button type="button" class="btn btn-primary" onclick="Step3dViewer.confirmSnapshot()" style="padding: 6px 18px; font-weight: 600; display: flex; align-items: center; gap: 6px;">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                        <span>确认截取并设为物料照片</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
