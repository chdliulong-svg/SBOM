<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统登录 · 变桨系统Service BOM</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0369a1 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            padding: 36px 32px 32px;
            box-sizing: border-box;
        }
        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: #1e3a8a;
            color: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.5px;
            box-shadow: 0 4px 10px rgba(30, 58, 138, 0.3);
        }
        .login-title {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.2;
        }
        .login-sub {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 24px;
        }
        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
            display: block;
        }
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .login-input {
            width: 100%;
            padding: 11px 40px 11px 14px;
            font-size: 15px;
            letter-spacing: 1px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        .login-input:focus {
            border-color: #1e3a8a;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }
        .btn-toggle-eye {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-toggle-eye:hover {
            color: #334155;
        }
        .login-btn {
            width: 100%;
            margin-top: 20px;
            padding: 11px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            background: #1e3a8a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);
            transition: background 0.2s ease, transform 0.1s ease;
        }
        .login-btn:hover {
            background: #172554;
        }
        .login-btn:active {
            transform: scale(0.99);
        }
        .login-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .login-error {
            display: none;
            margin-top: 14px;
            padding: 10px 12px;
            font-size: 13px;
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box">
            <div class="logo-icon">S</div>
            <div>
                <div class="login-title">变桨系统Service BOM</div>
                <div style="font-size: 11px; color: #64748b; margin-top: 2px;">统一物料主库 · 装配结构管理 · 标准化导出</div>
            </div>
        </div>
        <div class="login-sub">请输入系统访问口令以进入协同工作台</div>

        <form id="loginForm" autocomplete="off">
            <label class="form-label" for="passwordInput">系统访问口令</label>
            <div class="input-wrap">
                <input type="password" id="passwordInput" class="login-input" placeholder="请输入口令" autofocus>
                <button type="button" class="btn-toggle-eye" id="btnToggleEye" title="显示/隐藏口令">
                    <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">登 录 系 统</button>
        </form>

        <div class="login-error" id="loginError"></div>
    </div>

    <script>
        const nextUrl = {{ next_url|tojson }};

        function showError(msg) {
            const el = document.getElementById('loginError');
            el.textContent = msg;
            el.style.display = 'block';
        }

        // Toggle password show/hide
        const eyeBtn = document.getElementById('btnToggleEye');
        const pwInput = document.getElementById('passwordInput');
        if (eyeBtn && pwInput) {
            eyeBtn.addEventListener('click', function() {
                if (pwInput.type === 'password') {
                    pwInput.type = 'text';
                    eyeBtn.innerHTML = `
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    `;
                } else {
                    pwInput.type = 'password';
                    eyeBtn.innerHTML = `
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    `;
                }
            });
        }

        async function doLogin(password) {
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                let data = {};
                try { data = await res.json(); } catch (e) { data = {}; }
                if (res.ok && data.success) {
                    window.location.href = (nextUrl && nextUrl.startsWith('/')) ? nextUrl : '/';
                    return;
                }
                showError(data.error || `登录失败 (HTTP ${res.status})`);
            } catch (err) {
                showError('网络连接异常，请检查服务是否正常运行');
            } finally {
                const btn = document.getElementById('loginBtn');
                btn.disabled = false;
                btn.textContent = '登 录 系 统';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const pw = document.getElementById('passwordInput').value.trim();
            if (!pw) {
                showError('请输入访问口令');
                document.getElementById('passwordInput').focus();
                return;
            }
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = '正在验证口令...';
            document.getElementById('loginError').style.display = 'none';
            doLogin(pw);
        });

        // 探测若服务端已登录或免鉴权，则直接进入工作台
        (async function () {
            try {
                const res = await fetch('/api/auth/status');
                const st = await res.json();
                if (!st.required || st.authenticated) {
                    window.location.href = (nextUrl && nextUrl.startsWith('/')) ? nextUrl : '/';
                }
            } catch (e) { /* 保持登录页 */ }
        })();
    </script>
</body>
</html>
