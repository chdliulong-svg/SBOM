# ==============================================================================
# Nginx 配置文件: 变桨系统Service BOM 局域网反向代理与静态资源加速
# 部署路径建议: /etc/nginx/sites-available/service-bom -> /etc/nginx/sites-enabled/
# ==============================================================================
server {
    listen 80;
    server_name _;  # 匹配任意 IP 或域名

    # 允许上传最大 200MB 的工程包、Excel 及 PDF 手册
    client_max_body_size 200M;

    # Gzip 压缩传输加速
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 1. 静态前端资源直发（提升并发速度，降低 Python 服务负载）
    location /static/ {
        alias /opt/service-bom/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 2. 实物图片与技术手册附件直发
    location /assets/ {
        alias /opt/service-bom/assets/;
        expires 3d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. 动态应用接口反向代理至 Gunicorn (默认端口 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 针对大体量 Excel 报表解析与导出的超时保护配置
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
